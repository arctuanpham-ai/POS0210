name: POS0210 Build
# legacy signing secrets configured
on:
  push:
    branches: [ main, offline-first, candidate34-dev, candidate35-dev ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore legacy POS0210 signing key
        env:
          POS0210_KEYSTORE_BASE64: ${{ secrets.POS0210_KEYSTORE_BASE64 }}
          POS0210_KEYSTORE_PASSWORD: ${{ secrets.POS0210_KEYSTORE_PASSWORD }}
          POS0210_KEY_ALIAS: ${{ secrets.POS0210_KEY_ALIAS }}
        run: |
          test -n "$POS0210_KEYSTORE_BASE64"
          test -n "$POS0210_KEYSTORE_PASSWORD"
          test -n "$POS0210_KEY_ALIAS"
          printf '%s' "$POS0210_KEYSTORE_BASE64" | base64 --decode > app/pos0210-debug.keystore
          test -s app/pos0210-debug.keystore
          keytool -list -v -keystore app/pos0210-debug.keystore -storepass "$POS0210_KEYSTORE_PASSWORD" -alias "$POS0210_KEY_ALIAS" | grep -E 'Alias name:|Entry type:|SHA256:'
      - name: Unit tests and APK
        env:
          POS0210_KEYSTORE_PASSWORD: ${{ secrets.POS0210_KEYSTORE_PASSWORD }}
          POS0210_KEY_ALIAS: ${{ secrets.POS0210_KEY_ALIAS }}
          POS0210_KEY_PASSWORD: ${{ secrets.POS0210_KEY_PASSWORD }}
        run: gradle --no-daemon testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Verify APK and legacy certificate
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          CERT="$($ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk)"
          echo "$CERT"
          echo "$CERT" | grep -qi 'f552d0f158efb1a3573060ce496b3bf456ab005d20df0f7d893d9ec3bca11fe3'
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: POS0210-signed-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
