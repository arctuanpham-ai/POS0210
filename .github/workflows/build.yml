name: POS0210 Build
on:
  push:
    branches: [ main, offline-first ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore stable POS0210 signing key
        env:
          POS0210_KEYSTORE_BASE64: ${{ secrets.POS0210_KEYSTORE_BASE64 }}
        run: |
          test -n "$POS0210_KEYSTORE_BASE64"
          printf '%s' "$POS0210_KEYSTORE_BASE64" | base64 --decode > app/pos0210-debug.keystore
          test -s app/pos0210-debug.keystore
      - name: Unit tests and APK
        env:
          POS0210_KEYSTORE_PASSWORD: ${{ secrets.POS0210_KEYSTORE_PASSWORD }}
          POS0210_KEY_ALIAS: ${{ secrets.POS0210_KEY_ALIAS }}
          POS0210_KEY_PASSWORD: ${{ secrets.POS0210_KEY_PASSWORD }}
        run: gradle --no-daemon testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: POS0210-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
