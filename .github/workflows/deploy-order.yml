name: Deploy POS0210 Order Site
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web-order/**"
      - ".github/workflows/deploy-order.yml"
permissions:
  contents: write
jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Test order site
        working-directory: web-order
        run: node --test test/*.test.mjs
      - name: Auth gcloud
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_POS0210_17CE4 }}' > "$RUNNER_TEMP/sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json"
      - name: Create hosting site (idempotent)
        id: site
        run: |
          node web-order/ops/setup-backend.mjs 2>&1 | tee "$RUNNER_TEMP/setup.log"; rc=${PIPESTATUS[0]}
          echo "::notice title=setup::$(grep -iE 'rules|ruleset|Test|Anonymous|lỗi' "$RUNNER_TEMP/setup.log" | cut -c1-200 | tail -12 | tr '\n' '|' | sed 's/%/ /g')"
          exit $rc
        continue-on-error: true
      - name: Deploy Firebase Hosting (order site)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_POS0210_17CE4 }}
          channelId: live
          projectId: pos0210-17ce4
          entryPoint: web-order
        id: hosting
        continue-on-error: true
        timeout-minutes: 3
      - name: Deploy Firebase Hosting bằng CLI (dự phòng, có log)
        if: steps.hosting.outcome == 'failure'
        working-directory: web-order
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx -y firebase-tools@latest deploy --only hosting --project pos0210-17ce4 --non-interactive 2>&1 | tee "$RUNNER_TEMP/hosting.log"; rc=${PIPESTATUS[0]}; if [ $rc -ne 0 ]; then echo "::error title=hosting::$(tail -c 900 "$RUNNER_TEMP/hosting.log" | tr '\n' ' ' | sed 's/%/ /g')"; fi; exit $rc
      - name: Smoke test đặt hàng thật (món thường + combo, tự dọn)
        id: smoke
        continue-on-error: true
        run: |
          node web-order/ops/smoke-order.mjs 2>&1 | tee "$RUNNER_TEMP/smoke.log"; rc=${PIPESTATUS[0]}
          echo "::notice title=smoke::$(grep -E '^\[|TẤT CẢ|LỖI|Không có' "$RUNNER_TEMP/smoke.log" | cut -c1-230 | tr '\n' '|' | sed 's/%/ /g')"
          exit $rc
      - name: Chẩn đoán luật đặt đơn (tạm thời)
        continue-on-error: true
        run: |
          node web-order/ops/rules-debug.mjs 2>&1 | tee "$RUNNER_TEMP/dbg.log"
          echo "::notice title=dbg::$(cut -c1-330 "$RUNNER_TEMP/dbg.log" | tr '\n' '|' | sed 's/%/ /g')"
      - name: Post setup log as commit comment
        if: always()
        continue-on-error: true
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          { echo '```'; head -c 50000 "$RUNNER_TEMP/setup.log" 2>/dev/null || echo "(không có log)"; echo "--- hosting ---"; tail -c 6000 "$RUNNER_TEMP/hosting.log" 2>/dev/null; echo "--- smoke ---"; cat "$RUNNER_TEMP/smoke.log" 2>/dev/null; echo '```'; } > "$RUNNER_TEMP/c.md"
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@"$RUNNER_TEMP/c.md" >/dev/null || true
      - name: Fail if backend setup failed
        if: steps.site.outcome == 'failure'
        run: echo "Backend setup có lỗi, xem log bước trước" && exit 1
