name: Diag combos (read-only)
on:
  push:
    branches: [main]
    paths: [".github/workflows/diag-combos.yml"]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Read combos and sync times (read-only)
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_POS0210_17CE4 }}' > "$RUNNER_TEMP/sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" >/dev/null 2>&1
          TOKEN=$(gcloud auth print-access-token)
          B="https://firestore.googleapis.com/v1/projects/pos0210-17ce4/databases/(default)/documents/users/X9ln8CP7UtbOLOHfipYMCjfbb1p1/stores/0210"
          {
            echo "combos:"
            curl -s -H "Authorization: Bearer $TOKEN" "$B/combos?pageSize=100" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          if 'error' in d: print('ERROR',d['error'].get('message'))
          for x in d.get('documents',[]):
              f=x['fields']; print(' -',f.get('name',{}).get('stringValue'),'| active=',f.get('active',{}).get('booleanValue'),'| items=',len(f.get('items',{}).get('arrayValue',{}).get('values',[])),'| updated',x.get('updateTime'))
          print('count',len(d.get('documents',[])))"
            echo "menu (count, newest update):"
            curl -s -H "Authorization: Bearer $TOKEN" "$B/menu?pageSize=300&mask.fieldPaths=name" | python3 -c "
          import sys,json
          d=json.load(sys.stdin); docs=d.get('documents',[])
          print('count',len(docs),'newest',max([x.get('updateTime','') for x in docs] or ['']))"
            echo "dashboard/current:"
            curl -s -H "Authorization: Bearer $TOKEN" "$B/dashboard/current?mask.fieldPaths=updatedAt" | head -c 400
          } > "$RUNNER_TEMP/d.txt" 2>&1
          { echo '```'; cat "$RUNNER_TEMP/d.txt"; echo '```'; } > "$RUNNER_TEMP/c.md"
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@"$RUNNER_TEMP/c.md" >/dev/null
