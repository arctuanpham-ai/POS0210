name: Build menu snapshot for order site
# Giữ bản chụp menu cho khách (online_menu) luôn mới, kể cả khi menu đổi từ máy POS (máy POS không tự cập nhật bản chụp).
# Mỗi lần chạy khi không có gì đổi chỉ đọc ~75 tài liệu Firestore; chạy 30 phút/lần trong giờ quán (6h–23h giờ Việt Nam).
on:
  schedule:
    - cron: "7,37 23,0-16 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "1 = dựng lại toàn bộ (menu + ảnh) dù không có thay đổi"
        default: "0"
permissions:
  contents: read
concurrency:
  group: menu-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Auth gcloud
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_POS0210_17CE4 }}' > "$RUNNER_TEMP/sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" >/dev/null 2>&1
      - name: Build snapshot
        run: |
          if [ "${{ github.event.inputs.force }}" = "1" ]; then node web-order/ops/build-menu-snapshot.mjs --force; else node web-order/ops/build-menu-snapshot.mjs; fi
