name: POS0210 Sales QA
on:
  push:
    branches: [qa/coffee-sales-reconciliation-build285]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  room:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore existing signing key
        env:
          POS0210_KEYSTORE_BASE64: ${{ secrets.POS0210_KEYSTORE_BASE64 }}
        run: printf '%s' "$POS0210_KEYSTORE_BASE64" | base64 --decode > app/pos0210-debug.keystore
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Room instrumentation on API 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: gradle --no-daemon connectedDebugAndroidTest --stacktrace
      - name: Print per-test results
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as E
          for p in pathlib.Path('app/build/outputs/androidTest-results').rglob('*.xml'):
              try: root=E.parse(p).getroot()
              except E.ParseError: continue
              for t in root.iter('testcase'):
                  status='FAIL' if t.find('failure') is not None or t.find('error') is not None else 'SKIP' if t.find('skipped') is not None else 'PASS'
                  print(status, t.get('classname'), t.get('name'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sales-qa-${{ github.sha }}
          path: |
            app/build/reports
            app/build/outputs/androidTest-results
            app/build/outputs/apk
