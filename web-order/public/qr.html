<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Mã QR đặt món · 0210</title>
  <link rel="icon" href="assets/icon.png" type="image/png" />
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #2f241d; }
    body { margin: 0; background: #f6f0e5; }
    main { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; display: grid; gap: 16px; }
    .tools { display: grid; gap: 10px; padding: 14px; border: 1px solid #dfcfb8; border-radius: 16px; background: #fffcf7; }
    label { display: grid; gap: 6px; font-size: 13px; font-weight: 700; color: #58483a; }
    input { padding: 12px 14px; border: 1px solid #d5c2a8; border-radius: 12px; font: inherit; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    button { padding: 12px 16px; border: 0; border-radius: 12px; background: #1e1e1e; color: #fff; font: inherit; font-weight: 800; cursor: pointer; }
    button.alt { background: #fff8ee; color: #6e432d; border: 1px solid #836149; }
    .poster { padding: 28px 24px; border: 2px solid #1e1e1e; border-radius: 24px; background: #fff; text-align: center; display: grid; gap: 12px; justify-items: center; }
    .poster img.logo { width: 72px; height: 72px; border-radius: 16px; }
    .poster h1 { margin: 0; font-size: 28px; }
    .poster p { margin: 0; }
    .scan { font-size: 22px; font-weight: 800; }
    .qr { width: min(360px, 80vw); } .qr svg { width: 100%; height: auto; display: block; }
    .url { font-size: 15px; color: #58483a; word-break: break-all; }
    .hint { font-size: 13px; color: #77685b; }
    @media print {
      body { background: #fff; } .tools, .hint { display: none !important; }
      main { padding: 0; max-width: none; } .poster { border-width: 3px; min-height: 90vh; align-content: center; }
      .qr { width: 70vw; max-width: 480px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="tools">
      <label>Đường dẫn đặt món (đổi thành tên miền riêng nếu có)
        <input id="url" type="url" inputmode="url" autocomplete="off" />
      </label>
      <div class="row"><button type="button" id="print">In ra giấy</button><button type="button" class="alt" id="download">Tải ảnh PNG</button></div>
      <p class="hint">In khổ A5 hoặc A6 rồi dán tại bàn, quầy. Nên thử quét bằng điện thoại trước khi in.</p>
    </section>
    <section class="poster" id="poster">
      <img class="logo" src="assets/logo.png" alt="0210" style="height:64px;width:auto;border:0;background:none" />
      <h1 id="name">0210</h1>
      <p class="scan">Quét mã để đặt món</p>
      <div class="qr" id="qr"></div>
      <p class="url" id="url-text"></p>
      <p>Không cần đăng nhập · Không cần cài app</p>
    </section>
  </main>
  <script type="module">
    import { qrSvg } from "./qr.js";
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";
    import { firebaseConfig, STORE_OWNER_UID, STORE_ID } from "./config.js";

    const input = document.getElementById("url");
    const defaultUrl = `${location.origin}/`;
    input.value = new URLSearchParams(location.search).get("u") || defaultUrl;
    const draw = () => {
      const text = input.value.trim() || defaultUrl;
      document.getElementById("qr").innerHTML = qrSvg(text, { level: "Q" });
      document.getElementById("url-text").textContent = text.replace(/^https?:\/\//, "");
    };
    input.addEventListener("input", draw);
    draw();
    document.getElementById("print").addEventListener("click", () => window.print());
    document.getElementById("download").addEventListener("click", () => {
      const svg = document.querySelector("#qr svg");
      const image = new Image();
      const size = 1200;
      image.onload = () => {
        const canvas = document.createElement("canvas");
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, size, size);
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(image, 0, 0, size, size);
        const link = document.createElement("a");
        link.download = "qr-dat-mon.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
      };
      image.src = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(new XMLSerializer().serializeToString(svg))}`;
    });
    // Tên quán lấy từ cấu hình đặt món (không bắt buộc).
    try {
      const db = getFirestore(initializeApp(firebaseConfig));
      const snap = await getDoc(doc(db, "users", STORE_OWNER_UID, "stores", STORE_ID, "online_config", "shop"));
      if (snap.exists() && snap.data().name) document.getElementById("name").textContent = snap.data().name;
    } catch { /* giữ tên mặc định */ }
  </script>
</body>
</html>
