<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Mã QR đặt món · 0210</title>
  <link rel="icon" href="assets/icon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" />
  <style>
    :root { font-family: Montserrat, Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #2f241d; }
    body { margin: 0; background: #f6f0e5; }
    main { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; display: grid; gap: 16px; }
    .tools { display: grid; gap: 10px; padding: 14px; border: 1px solid #dfcfb8; border-radius: 16px; background: #fffcf7; }
    label { display: grid; gap: 6px; font-size: 13px; font-weight: 700; color: #58483a; }
    input { padding: 12px 14px; border: 1px solid #d5c2a8; border-radius: 12px; font: inherit; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    button { padding: 12px 16px; border: 0; border-radius: 12px; background: #1e1e1e; color: #fff; font: inherit; font-weight: 800; cursor: pointer; }
    button.alt { background: #fff8ee; color: #6e432d; border: 1px solid #836149; }
    .poster { padding: 28px 24px; border-radius: 24px; background: #f6efe2; text-align: center; display: grid; gap: 12px; justify-items: center; }
    .poster img.logo { width: 72px; height: 72px; border-radius: 16px; }
    .poster h1 { margin: 0; font-size: 28px; }
    .poster p { margin: 0; }
    .scan { font-size: 22px; font-weight: 800; }
    .qr { width: min(360px, 80vw); } .qr svg { width: 100%; height: auto; display: block; }
    .url { font-size: 15px; color: #58483a; word-break: break-all; }
    .info { display: grid; gap: 4px; margin-top: 6px; padding-top: 12px; border-top: 1px solid #dfcfb8; font-size: 14px; color: #3d332b; width: 100%; }
    .hint { font-size: 13px; color: #77685b; }
    @media print {
      body { background: #fff; } .tools, .hint { display: none !important; }
      main { padding: 0; max-width: none; } .poster { border-width: 3px; min-height: 90vh; align-content: center; }
      .qr { width: 70vw; max-width: 480px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="tools">
      <label>Đường dẫn đặt món (đổi thành tên miền riêng nếu có)
        <input id="url" type="url" inputmode="url" autocomplete="off" />
      </label>
      <div class="row"><button type="button" id="print">In ra giấy</button><button type="button" class="alt" id="download">Tải ảnh PNG</button></div>
      <p class="hint">In khổ A5 hoặc A6 rồi dán tại bàn, quầy. Ảnh PNG tải về có đủ logo và thông tin quán. Nên thử quét bằng điện thoại trước khi in.</p>
    </section>
    <section class="poster" id="poster">
      <img class="logo" src="assets/logo.png" alt="0210" style="height:64px;width:auto;border:0;background:none" />
      <p class="scan">Quét mã để đặt món</p>
      <div class="qr" id="qr"></div>
      <p class="url" id="url-text"></p>
      <p>Không cần đăng nhập · Không cần cài app</p>
      <div class="info" id="info" hidden></div>
    </section>
  </main>
  <script type="module">
    import { qrSvg } from "./qr.js";
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";
    import { firebaseConfig, STORE_OWNER_UID, STORE_ID } from "./config.js";

    const input = document.getElementById("url");
    const defaultUrl = `${location.origin}/`;
    input.value = new URLSearchParams(location.search).get("u") || defaultUrl;
    const draw = () => {
      const text = input.value.trim() || defaultUrl;
      document.getElementById("qr").innerHTML = qrSvg(text, { level: "Q" });
      document.getElementById("url-text").textContent = text.replace(/^https?:\/\//, "");
    };
    input.addEventListener("input", draw);
    draw();
    document.getElementById("print").addEventListener("click", () => window.print());
    let shop = {};
    const loadImage = (src) => new Promise((resolve, reject) => { const i = new Image(); i.onload = () => resolve(i); i.onerror = reject; i.src = src; });
    const wrap = (ctx, text, maxWidth) => {
      const words = String(text).split(/\s+/); const lines = []; let line = "";
      for (const w of words) { const t = line ? `${line} ${w}` : w; if (ctx.measureText(t).width > maxWidth && line) { lines.push(line); line = w; } else line = t; }
      if (line) lines.push(line); return lines;
    };
    // Ảnh PNG đầy đủ như tờ in: logo, kêu gọi quét, mã QR, đường dẫn, thông tin quán.
    document.getElementById("download").addEventListener("click", async () => {
      try { await document.fonts.ready; } catch { /* dùng font hệ thống */ }
      const svg = document.querySelector("#qr svg");
      const [logo, qr] = await Promise.all([
        loadImage("assets/logo.png"),
        loadImage(`data:image/svg+xml;charset=utf-8,${encodeURIComponent(new XMLSerializer().serializeToString(svg))}`),
      ]);
      const W = 1240, H = 1754, pad = 90, font = "Montserrat, Inter, Arial, sans-serif";
      const canvas = document.createElement("canvas"); canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext("2d");
      const bg = ctx.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, "#f8f1e4"); bg.addColorStop(1, "#ecdcc5");
      ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
      ctx.textAlign = "center"; ctx.textBaseline = "top";
      const info = [];
      if (shop.address) info.push(...wrap((ctx.font = `600 40px ${font}`, ctx), `Địa chỉ: ${shop.address}`, W - 2 * pad - 60));
      if (shop.phone) info.push(`Điện thoại: ${shop.phone}`);
      if (shop.hours) info.push(`Giờ mở cửa: ${shop.hours}`);
      const logoW = 560, logoH = Math.round(logo.height * logoW / logo.width), qrS = 680;
      const total = logoH + 70 + 84 + 50 + qrS + 104 + 52 + 20 + 46 + (info.length ? 60 + info.length * 58 : 0);
      let y = Math.max(100, Math.round((H - total) / 2));
      { const t = document.createElement("canvas"); t.width = logo.width; t.height = logo.height; const tc = t.getContext("2d");
        tc.drawImage(logo, 0, 0); tc.globalCompositeOperation = "source-in"; tc.fillStyle = "#5b3d2a"; tc.fillRect(0, 0, t.width, t.height);
        ctx.drawImage(t, (W - logoW) / 2, y, logoW, logoH); } y += logoH + 70;
      ctx.fillStyle = "#5b3d2a"; ctx.font = `800 76px ${font}`; ctx.fillText("Quét mã để đặt món", W / 2, y); y += 84 + 50;
      ctx.fillStyle = "#fff"; ctx.shadowColor = "rgba(91,61,42,.18)"; ctx.shadowBlur = 40; ctx.shadowOffsetY = 12;
      ctx.beginPath(); ctx.roundRect((W - qrS) / 2 - 44, y - 44, qrS + 88, qrS + 88, 44); ctx.fill(); ctx.shadowColor = "transparent";
      ctx.imageSmoothingEnabled = false; ctx.drawImage(qr, (W - qrS) / 2, y, qrS, qrS); ctx.imageSmoothingEnabled = true; y += qrS + 44 + 60;
      ctx.fillStyle = "#836149"; ctx.font = `700 46px ${font}`; ctx.fillText(document.getElementById("url-text").textContent, W / 2, y); y += 52 + 20;
      ctx.font = `500 38px ${font}`; ctx.fillText("Không cần đăng nhập · Không cần cài app", W / 2, y); y += 46;
      if (info.length) {
        y += 30; ctx.strokeStyle = "#cdb596"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(W - pad, y); ctx.stroke(); y += 30;
        ctx.fillStyle = "#5b3d2a"; ctx.font = `600 40px ${font}`;
        for (const line of info) { ctx.fillText(line, W / 2, y); y += 58; }
      }
      const link = document.createElement("a");
      link.download = "qr-dat-mon-0210.png"; link.href = canvas.toDataURL("image/png"); link.click();
    });
    // Thông tin quán (địa chỉ, SĐT, giờ mở) lấy từ cấu hình đặt món, hiện trên tờ in và trong ảnh PNG.
    try {
      const db = getFirestore(initializeApp(firebaseConfig));
      const snap = await getDoc(doc(db, "users", STORE_OWNER_UID, "stores", STORE_ID, "online_config", "shop"));
      if (snap.exists()) {
        shop = snap.data();
        const rows = [["Địa chỉ", shop.address], ["Điện thoại", shop.phone], ["Giờ mở cửa", shop.hours]].filter(([, v]) => v);
        const box = document.getElementById("info");
        box.innerHTML = rows.map(([k, v]) => `<div><b>${k}:</b> ${String(v).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]))}</div>`).join("");
        box.hidden = !rows.length;
      }
    } catch { /* không có thông tin quán thì chỉ in logo + QR */ }
  </script>
</body>
</html>
